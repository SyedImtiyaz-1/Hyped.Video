services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: launchreel
      POSTGRES_PASSWORD: launchreel
      POSTGRES_DB: launchreel
    ports: ["5433:5432"] # host port 5433, so it never clashes with another project on 5432
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
